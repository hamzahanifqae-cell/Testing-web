<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central Chat Demo</title>
    <script>
      window.ChatWidgetConfig = {
        chatAgentId: "6ad0f4aae10d96596671bde1",
        siteUrl: window.location.href,
      };
    </script>
    <script src="https://chats.trycentral.com/chat-widget-loader.js" async></script>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #1f6feb;
        --text: #1a1d29;
        --muted: #5d6470;
        --shadow: 0 12px 28px rgba(28, 38, 60, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff 0%, #f8fafc 100%);
        color: var(--text);
      }

      .container {
        max-width: 900px;
        margin: 80px auto;
        padding: 32px;
        background: var(--card);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }

      h1 {
        font-size: clamp(2.1rem, 5vw, 3.3rem);
        margin-bottom: 16px;
      }

      p {
        font-size: 1.08rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .cta {
        display: inline-block;
        margin-top: 18px;
        padding: 14px 22px;
        text-decoration: none;
        background: var(--primary);
        color: #fff;
        border-radius: 12px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Welcome to your new landing page</h1>
      <p>
        This is a simple one-page website with the Central chat widget configured in the
        head section so it loads on page view.
      </p>
      <p>
        You can replace this text with your own headline, product details, or contact
        information whenever you are ready.
      </p>
      <a class="cta" href="#">Get Started</a>
    </main>
  </body>
</html>
